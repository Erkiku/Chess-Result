<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Chess Championship 2026 — Leaderboard</title>
    <meta name="description" content="Live leaderboard and standings for the Grand Chess Championship 2026. Track player rankings, match results, and tournament progress in real-time.">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="leaderboard-page">

    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-brand">
                <img src="assets/bce-logo.svg" alt="BCE Bhagalpur" class="nav-brand-logo">
                UDAAN Chess
            </a>
            <div class="nav-actions">
                <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Switch to Light UI" aria-label="Toggle theme">☀️</button>
                <button class="nav-toggle" onclick="toggleNav()" aria-label="Toggle navigation">☰</button>
            </div>
            <ul class="navbar-links" id="navLinks">
                <li><a href="index.html" class="active"><span class="nav-icon"></span> Leaderboard</a></li>
                <li><a href="round-results.html"><span class="nav-icon"></span> Round Results</a></li>
                <li><a href="admin.html"><span class="nav-icon"></span> Admin</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- Page Header -->
        <div class="page-header animate-in">
            <div class="page-header-with-logo">
                <img src="assets/udaan-logo.jpg" alt="UDAAN Chess Club Logo" class="page-header-logo">
                <div>
                    <h1 class="page-title">UDAAN <span class="accent">Chess Tournament</span> 2026</h1>
                    <p class="page-subtitle" id="pageHeaderSubtitle">Live tournament standings and player rankings</p>
                </div>
            </div>
        </div>

        <!-- Winner & Runner Up Podium (Displayed only after all matches happen) -->
        <div class="podium-grid stagger-children" id="championsContainer" style="display: none;">
            <!-- Populated by JS when all matches are completed -->
        </div>

        <!-- Full Leaderboard Table -->
        <div class="card" style="padding: 0; overflow: hidden;">
            <div class="standings-card-header">
                <div class="standings-title-wrap">
                    <h2 class="standings-title">
                        📊 Full Standings
                    </h2>
                    <span id="standingsCategoryBadge" class="badge badge-in-progress">UDAAN Chess [Girls]</span>
                </div>
                <div class="tournament-toggle-pill" id="leaderboardTournamentToggle">
                    <button type="button" class="tournament-toggle-btn active" id="btnLeaderboardGirls" onclick="switchLeaderboardCategory('girls')">
                        👩 Girls
                    </button>
                    <button type="button" class="tournament-toggle-btn" id="btnLeaderboardBoys" onclick="switchLeaderboardCategory('boys')">
                        👨 Boys
                    </button>
                </div>
            </div>
            <div class="table-wrap" style="border: none; border-radius: 0;">
                <table>
                    <thead>
                        <tr>
                            <th class="col-center">Rank</th>
                            <th>Player</th>
                            <th>Roll-No</th>
                            <th class="col-center">Branch</th>
                            <th class="col-center">Points</th>
                            <th class="col-center">Played</th>
                            <th class="col-center">W</th>
                            <th class="col-center">D</th>
                            <th class="col-center">L</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr>
                            <td colspan="9">
                                <div class="loading">
                                    <div class="spinner"></div>
                                    <span>Loading standings...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Footer -->
        <footer class="site-footer">
            <div class="footer-inner">
                <p class="copyright-claim">
                    <span>© 2026</span>
                    <span>Design and Develop by</span>
                    <a href="https://github.com/Erkiku" target="_blank" rel="noopener noreferrer" class="footer-author-link" title="ErKiku on GitHub" aria-label="ErKiku GitHub Profile">
                        <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                        </svg>
                        <span>ErKiku</span>
                    </a>
                </p>
            </div>
        </footer>

    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/supabase.js?v=2.4"></script>
    <script src="js/scoring.js?v=2.4"></script>
    <script>
        // ========================
        // Index Page Logic
        // ========================

        let currentLeaderboard = [];

        function updateCategoryUI(cat) {
            const isBoys = cat === 'boys';
            const btnGirls = document.getElementById('btnLeaderboardGirls');
            const btnBoys = document.getElementById('btnLeaderboardBoys');
            const badge = document.getElementById('standingsCategoryBadge');
            const headerSubtitle = document.getElementById('pageHeaderSubtitle');

            if (btnGirls) btnGirls.classList.toggle('active', !isBoys);
            if (btnBoys) btnBoys.classList.toggle('active', isBoys);
            if (badge) {
                badge.textContent = isBoys ? 'UDAAN Chess [Boys]' : 'UDAAN Chess [Girls]';
                badge.className = `badge ${isBoys ? 'badge-win' : 'badge-in-progress'}`;
            }
            if (headerSubtitle) {
                headerSubtitle.textContent = `Live tournament standings and player rankings — ${isBoys ? 'Boys' : 'Girls'} Championship 2026`;
            }
        }

        function switchLeaderboardCategory(cat) {
            setSelectedTournamentCategory(cat);
            updateCategoryUI(cat);
            loadDashboard();
        }

        async function loadDashboard() {
            try {
                const tournamentId = getSelectedTournamentId();
                const category = getSelectedTournamentCategory();
                updateCategoryUI(category);

                const leaderboard = await getLeaderboard(tournamentId);
                currentLeaderboard = leaderboard;

                // Check if tournament has actually completed (not just an intermediate round)
                const [tournament, allMatches] = await Promise.all([
                    getTournament(tournamentId).catch(() => null),
                    getAllMatches(tournamentId).catch(() => [])
                ]);

                const totalRounds = (tournament && tournament.total_rounds) ? tournament.total_rounds : 5;
                const roundsInDb = new Set((allMatches || []).map(m => m.round_number));
                const hasAllRounds = totalRounds > 0 && Array.from({ length: totalRounds }, (_, i) => i + 1).every(r => roundsInDb.has(r));
                const allMatchesCompleted = allMatches && allMatches.length > 0 && allMatches.every(m => m.status === 'completed' && m.result && m.result !== 'pending');

                // The tournament champions podium is ONLY displayed when:
                // 1) The tournament status is explicitly set to 'completed'
                // OR
                // 2) All tournament rounds (e.g. all 5 rounds) have been scheduled AND every match across all rounds is completed, AND tournament is not 'in_progress'
                const isTournamentFinished = (tournament && tournament.status === 'completed') || 
                    (hasAllRounds && allMatchesCompleted && tournament?.status !== 'in_progress');

                if (isTournamentFinished && leaderboard && leaderboard.length >= 2) {
                    renderChampions(leaderboard.slice(0, 2));
                } else {
                    const container = document.getElementById('championsContainer');
                    if (container) {
                        container.innerHTML = '';
                        container.style.display = 'none';
                    }
                }

                // Full leaderboard
                renderLeaderboard(leaderboard);

            } catch (err) {
                console.error('Error loading dashboard:', err);
                showToast('Failed to load dashboard data', true);
            }
        }

        function renderChampions(top2) {
            const container = document.getElementById('championsContainer');
            if (!container) return;

            if (!top2 || top2.length < 2) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'grid';
            const winner = top2[0];
            const runnerUp = top2[1];
            const isTie = winner.total_points === runnerUp.total_points;

            container.innerHTML = `
                <!-- Winner Card -->
                <div class="podium-card winner">
                    <div class="podium-badge">${isTie ? '🤝 Joint Leader' : '🏆 Winner'}</div>
                    <div class="podium-rank">#1</div>
                    <div class="podium-name">${winner.player_name}</div>
                    <div class="podium-roll">Roll-No: ${winner.roll_no || winner.player_code}${winner.branch ? ' · Branch: ' + winner.branch : ''}</div>
                    <div class="podium-points">${winner.total_points} pts</div>
                    <div class="podium-meta">${winner.wins}W · ${winner.draws}D · ${winner.losses}L (${winner.matches_played} matches)</div>
                </div>

                <!-- Runner Up Card -->
                <div class="podium-card runner-up">
                    <div class="podium-badge">${isTie ? '🤝 Joint Leader' : '🥈 Runner Up'}</div>
                    <div class="podium-rank">${isTie ? '#1' : '#2'}</div>
                    <div class="podium-name">${runnerUp.player_name}</div>
                    <div class="podium-roll">Roll-No: ${runnerUp.roll_no || runnerUp.player_code}${runnerUp.branch ? ' · Branch: ' + runnerUp.branch : ''}</div>
                    <div class="podium-points">${runnerUp.total_points} pts</div>
                    <div class="podium-meta">${runnerUp.wins}W · ${runnerUp.draws}D · ${runnerUp.losses}L (${runnerUp.matches_played} matches)</div>
                </div>
            `;
        }

        function renderLeaderboard(data) {
            const tbody = document.getElementById('leaderboardBody');
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state" style="padding: 30px;"><p>No players registered for this tournament yet. Visit Admin to add players and create pairings.</p></div></td></tr>`;
                return;
            }
            tbody.innerHTML = data.map((p, i) => `
                <tr>
                    <td class="rank-cell ${p.rank === 1 ? 'rank-1' : ''} col-center">${p.rank !== null && p.rank !== undefined ? p.rank : '—'}</td>
                    <td><strong>${p.player_name}</strong></td>
                    <td style="color: var(--white-50); font-family: monospace;">${p.roll_no || p.player_code}</td>
                    <td class="col-center"><span class="badge badge-branch">${p.branch || '—'}</span></td>
                    <td class="points-highlight col-center">${p.total_points}</td>
                    <td class="col-center">${p.matches_played}</td>
                    <td class="col-center">${p.wins}</td>
                    <td class="col-center">${p.draws}</td>
                    <td class="col-center">${p.losses}</td>
                </tr>
            `).join('');
        }

        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.innerHTML = `<span>${isError ? '⚠️' : '✓'}</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function toggleNav() {
            document.getElementById('navLinks').classList.toggle('open');
        }

        // Realtime subscription
        subscribeToMatches((payload) => {
            showToast('Results updated — refreshing...');
            loadDashboard();
        });

        // Initialize
        loadDashboard();
    </script>
</body>
</html>
